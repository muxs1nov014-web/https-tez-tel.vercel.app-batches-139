<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <!-- Home screen ("Add to Home Screen"): opens as its own app, without the browser's address bar and buttons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TezTel" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Telegram Mini App: load the WebApp SDK only when opened from Telegram (Telegram puts tgWebApp*
      // params in the URL hash; the session flag keeps it loading after in-app reloads). Elsewhere no request is made.
      (function () {
        var fromTelegram = /tgWebApp(Data|Platform|Version)=/.test(location.hash);
        try {
          if (fromTelegram) sessionStorage.setItem('telefon.tg', '1');
          fromTelegram = fromTelegram || sessionStorage.getItem('telefon.tg') === '1';
        } catch (e) {}
        if (fromTelegram) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      })();
    </script>
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts) to avoid a light flash.
      (function () {
        var pref = 'system';
        try {
          pref = localStorage.getItem('telefon.theme') || 'system';
        } catch (e) {}
        var app = window.Telegram && window.Telegram.WebApp;
        var tg = app && app.platform && app.platform !== 'unknown' ? app : null;
        var systemDark = tg ? tg.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var dark = pref === 'dark' || (pref !== 'light' && systemDark);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
        }
      })();
    </script>
    <title>TezTel — boshqaruv paneli</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
